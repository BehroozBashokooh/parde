<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parde</title>
<meta name="description" content="Parde (پرده) — hear and measure the intervals of Persian music. Scale patterns and interval sizes after Nosa's ScalesTest app (music.nosa.com/ScalesTest), based on the research of Maestro Hamid Motebassem and Mehrdad Momeni.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232c4a9a'/%3E%3Cpath d='M9 7v18M9 15l12 5-12 5' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Parde · src/styles.css — design tokens (light/dark), layout, components, right-to-left rules. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --sunk:#e8ebf2; --ink:#1b2233; --muted:#5a6377; --line:#d6dbe6;
  --T:#2c4a9a; --B:#b0721a; --J:#12837c; --S:#a3405a; --H:#6a4a9c;
  --accent:#2c4a9a; --good:#1f7a4a; --bad:#b3382f;
  --tint:.14;
  --display:"Marcellus", "Palatino Linotype", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --fa:"Vazirmatn", "Geeza Pro", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e121a; --surface:#161b26; --sunk:#1d2330; --ink:#e6e9f0; --muted:#98a1b4; --line:#2a3142;
    --T:#8ca6f2; --B:#e3aa4f; --J:#4cc4b9; --S:#e7849c; --H:#b095e6;
    --accent:#8ca6f2; --good:#5fc98c; --bad:#ef7a70; --tint:.2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e121a; --surface:#161b26; --sunk:#1d2330; --ink:#e6e9f0; --muted:#98a1b4; --line:#2a3142;
  --T:#8ca6f2; --B:#e3aa4f; --J:#4cc4b9; --S:#e7849c; --H:#b095e6;
  --accent:#8ca6f2; --good:#5fc98c; --bad:#ef7a70; --tint:.2;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:.01em;line-height:1.1}
.brand .fa{font-family:var(--fa);color:var(--muted);font-size:.95rem;margin-inline-start:.5rem}
.brand p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem;max-width:60ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
nav.tabs button{font:inherit;font-weight:500;background:none;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{margin-top:20px}
h2{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0 0 .3rem;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .5rem;font-weight:600}
p{margin:.3rem 0 .7rem;max-width:68ch}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:500}
select,input[type=number]{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=range]{accent-color:var(--accent);width:120px}
.btn{font:inherit;font-size:.9rem;font-weight:500;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.on{background:var(--sunk);border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.mode-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.mode-title .fa{font-family:var(--fa);font-size:1.3rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{font-family:var(--mono);font-size:.8rem;padding:2px 8px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.chip.sep{--c:var(--muted);background:none;border:none;padding:2px 2px}
/* ruler */
.ruler{position:relative;margin:8px 0 46px}
.ruler .lab{font-size:.75rem;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.ruler .bar{display:flex;height:40px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg{--c:var(--T);display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--surface);background:color-mix(in srgb,var(--c) calc(var(--tint)*100% + 6%),var(--surface));color:var(--c);cursor:pointer;min-width:0;font-family:var(--mono);line-height:1.1;border-top:3px solid var(--c)}
.seg:last-child{border-right:none}
.seg b{font-size:.85rem}
.seg small{font-size:.66rem;opacity:.85}
.seg:hover{filter:brightness(1.08)}
.ticks{position:absolute;left:0;right:0;top:0;height:40px}
.tick{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:.72rem;white-space:nowrap;cursor:pointer}
.tick .n{font-family:var(--mono);color:var(--muted);font-size:.68rem;display:block}
.tick .nm{font-weight:500}
.tick.hot .nm{color:var(--accent)}
.diffmark{position:absolute;top:-4px;height:calc(100% + 8px);border-left:2px dashed var(--S)}
/* wheel */
svg.wheel{width:100%;max-width:300px;height:auto;display:block;margin:auto}
svg.wheel text{font-family:var(--body)}
.dot{cursor:pointer}
.dot.hot circle{stroke:var(--ink);stroke-width:3}
/* table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dev-big{color:var(--S);font-weight:600}
.acc{display:inline-block;vertical-align:-2px;margin-left:1px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fact .v{font-size:.92rem;margin-top:2px}
.note{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:12px}
.stack{display:flex;flex-direction:column;gap:16px}
/* intervals */
.ivgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.iv{--c:var(--T);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.iv .sym{font-family:var(--display);font-size:2rem;color:var(--c);line-height:1}
.iv .nm{font-weight:600}
.iv .fa{font-family:var(--fa);color:var(--muted)}
.iv .num{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.formula{font-family:var(--mono);background:var(--sunk);padding:10px 12px;border-radius:6px;overflow-x:auto;font-size:.88rem}
/* quiz */
.qtypes{display:flex;flex-wrap:wrap;gap:6px}
.qarea{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.answers{display:flex;flex-wrap:wrap;gap:8px}
.answers .btn{min-width:88px;justify-content:center}
.answers .btn.right{background:color-mix(in srgb,var(--good) 20%,var(--surface));border-color:var(--good)}
.answers .btn.wrong{background:color-mix(in srgb,var(--bad) 18%,var(--surface));border-color:var(--bad)}
.fb{min-height:1.5em;font-weight:500}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.score{display:flex;gap:18px;font-family:var(--mono);font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.score b{color:var(--ink)}
.turn{font-weight:600;color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.turn.live{animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){.turn.live{animation:none}}
/* plan */
.stage{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:none}
.stage .no{font-family:var(--display);font-size:1.6rem;color:var(--accent);width:2ch;text-align:center}
.stage h4{margin:0 0 4px;font-size:1rem}
.stage ul{margin:4px 0 0;padding-left:18px}
.stage li{margin:2px 0}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
label.chk input{margin-top:4px;accent-color:var(--accent)}
.routine{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rstep{background:var(--sunk);border-radius:8px;padding:12px}
.rstep .t{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
#aStat[data-s="live"]{color:var(--good)}#aStat[data-s="blocked"]{color:var(--bad)}
kbd{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
/* bilingual + credit */
.wrap[dir="rtl"]{font-family:var(--fa)}
.wrap[dir="rtl"] *{letter-spacing:0 !important}
.wrap[dir="rtl"] h1,.wrap[dir="rtl"] h2,.wrap[dir="rtl"] .stage .no{font-family:var(--fa);font-weight:600}
.wrap[dir="rtl"] h3,.wrap[dir="rtl"] th,.wrap[dir="rtl"] .fact .k{text-transform:none;font-size:.85rem}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap[dir="rtl"] .score,.wrap[dir="rtl"] .rstep .t{font-family:var(--fa)}
th,td{text-align:start}
.note{border-left:none;border-inline-start:2px solid var(--line);padding-left:0;padding-inline-start:10px}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.wrap[dir="rtl"] .topright{align-items:flex-start}
.langbtn{font-family:var(--fa)}
.wrap[dir="rtl"] .langbtn{font-family:var(--body)}
a{color:var(--accent)}
.credit{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:.86rem}
.credit .lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);padding-top:2px}
.credit p{margin:0 0 .35rem;max-width:none}
.credit p:last-child{margin-bottom:0}
@media (max-width:600px){.credit{grid-template-columns:1fr}}
.fbrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:.5rem!important}
.fbrow .btn{padding:4px 10px;font-size:.85rem}
.altbtn{font:inherit;font-size:.8rem;padding:2px 8px;border-radius:999px;border:1px dashed var(--accent);background:var(--surface);color:var(--ink);cursor:pointer;margin:1px 0}
.altbtn:hover{background:var(--sunk)}
.altdot{cursor:pointer}
.srcbadge{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
a.srcbadge{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
</style>
</head>
<body>
<div class="wrap" id="app" dir="ltr" lang="en">
  <header class="top">
    <div class="brand">
      <h1 id="h1"></h1>
      <p data-i18n="sub"></p>
    </div>
    <div class="topright">
      <button class="btn langbtn" id="langBtn" type="button"></button>
      <div class="controls" aria-label="Sound settings">
        <label class="field"><span data-i18n="tuning"></span>
          <select id="tuning"><option value="nosa" data-i18n="tun_nosa"></option><option value="q" data-i18n="tun_q"></option></select>
        </label>
        <label class="field"><span data-i18n="sound"></span>
          <select id="timbre"><option value="pluck" data-i18n="pluck"></option><option value="sine" data-i18n="sine"></option></select>
        </label>
        <label class="field"><span data-i18n="volume"></span> <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></label>
        <div class="field"><span id="aStat" data-s="unknown"></span><button class="btn" id="aTest" data-i18n="test"></button></div>
      </div>
    </div>
  </header>

  <aside class="credit" id="credit" aria-labelledby="creditLbl">
    <div class="lbl" id="creditLbl" data-i18n="credit_lbl"></div>
    <div data-i18n="credit_body"></div>
  </aside>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="explore" aria-selected="true" data-i18n="tab_explore"></button>
    <button role="tab" data-tab="intervals" aria-selected="false" data-i18n="tab_intervals"></button>
    <button role="tab" data-tab="ear" aria-selected="false" data-i18n="tab_ear"></button>
    <button role="tab" data-tab="plan" aria-selected="false" data-i18n="tab_plan"></button>
  </nav>

  <!-- EXPLORER -->
  <section class="panel" id="tab-explore">
    <div class="box">
      <div class="controls">
        <label class="field"><span data-i18n="mode"></span> <select id="mode"></select></label>
        <label class="field"><span data-i18n="cmp"></span> <select id="cmp"></select></label>
        <label class="field"><span data-i18n="tonic"></span> <select id="tonic"></select></label>
        <label class="field"><span data-i18n="tempo"></span> <span><input type="range" id="bpm" min="40" max="160" value="84"> <span id="bpmv" class="muted">84</span></span></label>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn primary" id="pUp" data-i18n="up"></button>
        <button class="btn" id="pDown" data-i18n="down"></button>
        <button class="btn" id="pBoth" data-i18n="both"></button>
        <button class="btn" id="pCmp" data-i18n="pcmp"></button>
        <button class="btn" id="pDrone" aria-pressed="false"></button>
        <button class="btn" id="pEcho" data-i18n="echo"></button>
        <button class="btn" id="pStop" data-i18n="stop"></button>
      </div>
      <div id="echoStatus" class="muted" style="margin-top:8px;min-height:1.4em"></div>
    </div>

    <div class="grid2" style="margin-top:16px">
      <div class="box">
        <h3 data-i18n="wheel_h"></h3>
        <div id="wheel" class="ltr"></div>
        <p class="muted" style="font-size:.8rem;margin-top:8px" id="wheelNote"></p>
      </div>
      <div class="box stack">
        <div>
          <div class="mode-title"><h2 id="mName"></h2><span class="fa" id="mFa"></span></div>
          <div class="chips ltr" id="mChips"></div>
          <p id="mDesc"></p>
          <p class="note" id="mNote" hidden></p>
          <div id="mSrc"></div>
        </div>
        <div>
          <h3 data-i18n="ruler_h"></h3>
          <div id="rulers" class="ltr"></div>
        </div>
        <div class="facts" id="facts"></div>
      </div>
    </div>

    <div class="box" style="margin-top:16px">
      <h3 data-i18n="deg_h"></h3>
      <div class="tbl"><table id="dtable"></table></div>
      <p class="note" data-i18n="model_note"></p>
    </div>
  </section>

  <!-- INTERVALS -->
  <section class="panel" id="tab-intervals" hidden>
    <div class="stack">
      <div class="box">
        <h2 data-i18n="iv_h2"></h2>
        <p data-i18n="iv_p"></p>
        <div class="ivgrid" id="ivgrid"></div>
      </div>
      <div class="box">
        <h2 data-i18n="cents_h2"></h2>
        <p data-i18n="cents_p"></p>
        <div class="formula ltr">cents = 1200 · log₂(f₂ / f₁)&nbsp;&nbsp;&nbsp;&nbsp;e.g. 9/8 → 1200·log₂(1.125) = 203.9¢</div>
        <div class="controls" style="margin-top:12px">
          <label class="field">f₁ (Hz) <input type="number" id="f1" value="261.63" step="0.01" style="width:110px"></label>
          <label class="field">f₂ (Hz) <input type="number" id="f2" value="285" step="0.01" style="width:110px"></label>
          <button class="btn" id="fPlay" data-i18n="playboth"></button>
          <div class="field"><span data-i18n="result"></span> <span id="fRes" style="font-family:var(--mono);color:var(--ink);font-size:.95rem"></span></div>
        </div>
        <p class="note" data-i18n="beats_note"></p>
      </div>
      <div class="box">
        <h2 data-i18n="mm_h2"></h2>
        <p data-i18n="mm_p"></p>
        <div id="mmRulers" class="ltr"></div>
        <div class="btnrow"><button class="btn" data-play="major" data-i18n="play_major"></button><button class="btn" data-play="minor" data-i18n="play_minor"></button><button class="btn" data-play="shur" data-i18n="play_shur"></button></div>
        <p class="note" data-i18n="mm_note"></p>
      </div>
    </div>
  </section>

  <!-- EAR -->
  <section class="panel" id="tab-ear" hidden>
    <div class="box">
      <h2 data-i18n="ear_h2"></h2>
      <p class="muted" data-i18n="ear_p"></p>
      <div class="qtypes" id="qtypes"></div>
      <div class="controls" style="margin-top:12px">
        <label class="field"><span data-i18n="level"></span> <select id="qlevel"></select></label>
        <label class="field"><span data-i18n="playas"></span> <select id="qhow"><option value="mel" data-i18n="mel"></option><option value="harm" data-i18n="harm"></option></select></label>
      </div>
      <div class="qarea">
        <div id="qprompt" style="font-weight:500"></div>
        <div class="btnrow"><button class="btn" id="qReplay" data-i18n="replay"></button><button class="btn" id="qStop" data-i18n="stop"></button><button class="btn" id="qRef" data-i18n="hear"></button><button class="btn primary" id="qNext" data-i18n="next"></button></div>
        <div class="answers" id="qans"></div>
        <div class="fb" id="qfb"></div>
        <div class="score" id="qscore"></div>
      </div>
    </div>
  </section>

  <!-- PLAN -->
  <section class="panel" id="tab-plan" hidden>
    <div class="stack">
      <div class="box">
        <h2 data-i18n="daily_h2"></h2>
        <div class="routine">
          <div class="rstep"><div class="t" data-i18n="r1t"></div><span data-i18n="r1"></span></div>
          <div class="rstep"><div class="t" data-i18n="r2t"></div><span data-i18n="r2"></span></div>
          <div class="rstep"><div class="t" data-i18n="r3t"></div><span data-i18n="r3"></span></div>
          <div class="rstep"><div class="t" data-i18n="r4t"></div><span data-i18n="r4"></span></div>
        </div>
      </div>
      <div class="box">
        <h2 data-i18n="path_h2"></h2>
        <p class="muted" data-i18n="path_p"></p>
        <div id="stages"></div>
      </div>
    </div>
  </section>
</div>
<script>
(()=>{
/* Parde · src/js/00-core.js
   DOM helpers, per-browser storage (localStorage, wrapped so the app works without it), Nosa link.
   Fragment of one shared scope: tools/build.py concatenates src/js/*.js in name order
   inside a single (()=>{ ... })() closure. Not an ES module. */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('dlab-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dlab-'+k,JSON.stringify(v))}catch(e){}}};
const NOSA='https://music.nosa.com/ScalesTest/';

};
const IVINFO={

  B:{name:'Baqiyye',fa:'بقیه',en:'small half step (limma)',enFa:'نیم‌پرده‌ی کوچک (لیما)',ratio:'256 : 243',q:100},

const MODES=[

  const beat=60/S.bpm;let end=0;events.forEach(e=>end=Math.max(end,e.at+(e.d||1)));
  const put=(c,dest,t0)=>events.forEach(e=>{if(e.f)(Array.isArray(e.f)?e.f:[e.f]).forEach(f=>note(c,f,t0+e.at*beat,(e.d||1)*beat*.95,dest,Array.isArray(e.f)?.35:.5))});
  const arm=(startIn,stopFn)=>{ // UI timers relative to audio start
    const timers=[];events.forEach(e=>{if(e.ui)timers.push(setTimeout(()=>e.ui(),(startIn+e.at*beat)*1000))});
    timers.push(setTimeout(()=>{$$('.hot').forEach(x=>x.classList.remove('hot'));seq=null;onEnd&&onEnd()},(startIn+end*beat)*1000+150));
    seq={stop:stopFn,timers};
  };
  ensureAudio().then(async live=>{
    if(tok!==playTok)return;
    if(live){const bus=ctx.createGain();bus.connect(master);put(ctx,bus,ctx.currentTime+.08);arm(.08,()=>bus.disconnect());return}
    const url=await render(end*beat+1.6,(oc,out)=>put(oc,out,.05));if(tok!==playTok)return;
    const a=new Audio(url);arm(.05,()=>{a.pause();URL.revokeObjectURL(url)});
    a.play().catch(()=>{mode='blocked';setStatus()});
  });
}
function setDrone(on){
  S.drone=on;const b=$('#pDrone');if(b){b.textContent=tx(on?'drone_on':'drone_off');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}
  if(droneNodes){const {g,oscs}=droneNodes;g.gain.setTargetAtTime(0,ctx.currentTime,.08);oscs.forEach(o=>o.stop(ctx.currentTime+.5));droneNodes=null}
  if(droneEl){droneEl.pause();droneEl=null}
  if(!on)return;
  const f=tonicFreq()/2*Math.pow(2,degs(M[S.mode])[0]/1200),fifth=1.5; // drone uses a pure 3:2 fifth in both tunings
  const build=(c,dest,loopSafe)=>{
    const g=c.createGain();g.gain.value=loopSafe?.09:0;if(!loopSafe)g.gain.setTargetAtTime(.09,c.currentTime,.3);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.connect(g).connect(dest);
    const parts=loopSafe?[[f,1],[f*fifth,.45],[f/2,.5]]:[[f,1],[f*1.003,.6],[f*fifth,.45],[f/2,.5]];
    const oscs=parts.map(([fr,a])=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=fr;const v=c.createGain();v.gain.value=a;o.connect(v).connect(lp);o.start();return o});
    return {g,oscs};
  };
  ensureAudio().then(async live=>{
    if(!S.drone)return;
    if(live){droneNodes=build(ctx,master,false);return}
    const secs=Math.round(4*f/2)/(f/2); // whole number of periods → seamless loop
    const url=await render(secs,(oc,out)=>build(oc,out,true));if(!S.drone)return;
    droneEl=new Audio(url);droneEl.loop=true;droneEl.play().catch(()=>{mode='blocked';setStatus()});
  });
}

    return {answers:pool,correct:k,label:x=>mName(M[x]),play:()=>{setDrone(true);play(ev)},ref:()=>{setDrone(true);play(pool.flatMap((x,j)=>scaleEvents(M[x],'up','x',j*9.5)))}}}
  if(Q.type==='degree'){const m=M[S.mode],d=degs(m),n=L?8:5,k=Math.floor(Math.random()*n);
    return {answers:[...Array(n).keys()].map(String),correct:String(k),label:x=>`${+x+1} · ${spell(+x+ROT(m),d[+x]).txt}`,play:()=>{setDrone(true);play([{f:fq(d[k]),at:0,d:2}])},ref:()=>{setDrone(true);play(scaleEvents(m,'up','x',0).slice(0,n))}}}
}
function renderQTypes(){
  $('#qtypes').innerHTML=Object.entries(QT).map(([k,v])=>`<button class="btn ${k===Q.type?'on':''}" data-qt="${k}">${L2(...v.label)}</button>`).join('');
  $('#qlevel').innerHTML=QT[Q.type].levels.map((l,i)=>`<option value="${i}">${i+1} · ${L2(...l)}</option>`).join('');
  Q.level=Math.min(store.get('lvl-'+Q.type,0),QT[Q.type].levels.length-1);$('#qlevel').value=Q.level;
  $('#qhow').closest('.field').hidden=Q.type!=='interval';
}
function qPrompt(){return L2(...QT[Q.type].prompt)+(Q.type==='degree'?` — ${mName(M[S.mode])}, ${tx('on')} ${tonicName(S.tonic)}`:'')}
function renderQAnswers(){ // re-label the current question (used on language switch too)
  if(!Q.cur)return;$('#qprompt').textContent=qPrompt();
  $('#qans').innerHTML=Q.cur.answers.map(a=>`<button class="btn" data-a="${a}">${Q.cur.label(a)}</button>`).join('');
  if(Q.answered&&Q.last){const b=$(`#qans [data-a="${Q.last}"]`);b&&b.classList.add(Q.last===Q.cur.correct?'right':'wrong');$(`#qans [data-a="${Q.cur.correct}"]`).classList.add('right');showFb()}
}
function newQ(autoplay=true){
  Q.cur=genQ();Q.answered=false;Q.last=null;$('#qfb').textContent='';$('#qfb').className='fb';
  renderQAnswers();renderScore();if(autoplay)Q.cur.play();
}
function key(){return Q.type+':'+Q.level}
function renderScore(){const s=stats[key()]||{r:0,n:0,streak:0,best:0,last:[]};const last=s.last.slice(-20);const pct=last.length?Math.round(100*last.filter(Boolean).length/last.length):0;
  $('#qscore').innerHTML=`<span>${tx('sc_all')} <b><bdi dir="ltr">${s.r}/${s.n}</bdi></b></span><span>${tx('sc_20')} <b>${last.length?pct+'%':'—'}</b>${last.length>=20&&pct>=85?tx('sc_ready'):''}</span><span>${tx('sc_streak')} <b>${s.streak}</b> (${tx('sc_best')} ${s.best})</span>`}
function showFb(){const ok=Q.last===Q.cur.correct;$('#qfb').innerHTML=ok?tx('fb_ok'):tx('fb_no',{x:Q.cur.label(Q.cur.correct)});$('#qfb').className='fb '+(ok?'good':'bad')}
function answer(a,btn){
  if(Q.answered)return;Q.answered=true;Q.last=a;const ok=a===Q.cur.correct;
  const s=stats[key()]||(stats[key()]={r:0,n:0,streak:0,best:0,last:[]});s.n++;if(ok){s.r++;s.streak++;s.best=Math.max(s.best,s.streak)}else s.streak=0;s.last.push(ok?1:0);s.last=s.last.slice(-40);store.set('stats',stats);
  btn.classList.add(ok?'right':'wrong');if(!ok)$(`#qans [data-a="${Q.cur.correct}"]`).classList.add('right');
  showFb();renderScore();
}

/* Parde · src/js/80-app.js
   Language switching (incl. right-to-left), feedback button, and all event wiring. Runs last.
   Fragment of one shared scope: tools/build.py concatenates src/js/*.js in name order
   inside a single (()=>{ ... })() closure. Not an ES module. */
/* ---------- language ---------- */
function applyLang(){
  const app=$('#app');app.dir=S.lang==='fa'?'rtl':'ltr';app.lang=S.lang;
  $$('[data-i18n]').forEach(el=>{el.innerHTML=tx(el.dataset.i18n)});
  $('#h1').innerHTML=tx('h1');$('#langBtn').textContent=tx('lang');$('#langBtn').lang=S.lang==='fa'?'en':'fa';
  document.title=S.lang==='fa'?'پرده':'Parde';
  setStatus();const b=$('#pDrone');b.textContent=tx(S.drone?'drone_on':'drone_off');
  fillSelects();renderExplore();renderIntervals();renderQTypes();renderPlan();renderQAnswers();renderScore();
  if(!echoRun)$('#echoStatus').textContent='';
}

/* ---------- feedback (claude.ai comments, composer-only: opens the shell's own comment box) ---------- */
let commentsNS;const commentsReady=(window.claude&&window.claude.use)?window.claude.use('comments').then(c=>commentsNS=c).catch(()=>commentsNS=null):Promise.resolve(commentsNS=null);
/* outside claude.ai: on GitHub Pages (user.github.io/repo/) feedback goes to the repo's Issues page */
function githubIssuesURL(){
  const h=location.hostname;if(!/\.github\.io$/i.test(h))return null;
  const user=h.split('.')[0],seg=location.pathname.split('/').filter(Boolean)[0],repo=seg&&!/\.html?$/i.test(seg)?seg:h;
  return `https://github.com/${user}/${repo}/issues/new?title=${encodeURIComponent('Feedback: ')}`;
}
async function sendFeedback(){
  const msg=$('#fbMsg');msg.textContent='';
  const gh=githubIssuesURL();if(gh&&!(window.claude&&window.claude.use)){window.open(gh,'_blank','noopener');msg.textContent=tx('fb_gh');return}
  const c=commentsNS===undefined?await commentsReady:commentsNS;
  if(!c){msg.textContent=tx('fb_signin');return}
  try{const r=await c.openComposer({element:$('#credit')});if(r&&r.opened)msg.textContent=tx('fb_open')}
  catch(e){msg.textContent=tx('fb_signin')}
}
/* ---------- wiring ---------- */
applyLang();

$('#pDrone').onclick=()=>setDrone(!S.drone);

document.addEventListener('click',e=>{
  if(e.target.closest('#fbBtn')){sendFeedback();return}
  const rv=e.target.closest('#echoReveal');if(rv){const r=window.__echoRun;if(r&&r.ans)rv.outerHTML=tx('echo_ans',{a:r.ans});return}
  const seg=e.target.closest('.seg');if(seg){const m=M[seg.dataset.m],d=degs(m),i=+seg.dataset.seg;play([{f:fq(d[i]),at:0},{f:fq(d[i+1]),at:1,d:1.3}]);return}
  const tk=e.target.closest('.tick');if(tk){playDeg(+tk.dataset.deg,M[tk.dataset.m],tk.id.replace(/\d+$/,''));return}
  const alt=e.target.closest('[data-alt]');if(alt){play([{f:fq(+alt.dataset.alt),at:0,d:1.5}]);return}
  const dot=e.target.closest('.dot');if(dot){playDeg(+dot.dataset.deg);return}
  const iv=e.target.closest('[data-iv]');if(iv){playInterval(iv.dataset.iv,tonicFreq(),true);return}
  const vs=e.target.closest('[data-ivvs]');if(vs){const b=tonicFreq(),k=vs.dataset.ivvs;play([{f:b,at:0},{f:b*Math.pow(2,tun().T/1200),at:1,d:1.3},{f:b,at:3},{f:b*Math.pow(2,tun()[k]/1200),at:4,d:1.3}]);return}
  const pm=e.target.closest('[data-play]');if(pm){play(scaleEvents(M[pm.dataset.play],'up','m'));return}
  const qt=e.target.closest('[data-qt]');if(qt){Q.type=qt.dataset.qt;store.set('qtype',Q.type);renderQTypes();newQ();return}
  const an=e.target.closest('[data-a]');if(an){answer(an.dataset.a,an);return}
});
